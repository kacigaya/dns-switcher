name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: make dmg VERSION="${{ steps.ver.outputs.version }}"

      - name: Upload DMG
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: DNSSwitcher.dmg

      - name: Update Homebrew cask
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          SHA=$(shasum -a 256 DNSSwitcher.dmg | awk '{print $1}')

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/" Formula/dnsswitcher.rb
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Formula/dnsswitcher.rb
          git add Formula/dnsswitcher.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
          else
            git commit -m "chore(cask): set v${VERSION} checksum [skip ci]"
            git push origin main
          fi
